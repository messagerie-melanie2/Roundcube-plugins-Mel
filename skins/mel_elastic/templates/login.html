<roundcube:include file="includes/layout.html" />

<header role="banner">
  <h1 class="voice">
    <roundcube:object name="productname" /> <roundcube:label name="login" />
  </h1>
  <bnum-img
    class="ministere-logo customMode"
    src="skins/mel_elastic/images/logo-light.png"
    data-src-small="0"
    id=""
    alt="Ministères Transition Ecologique, Cohésion des Territoires, Mer - Liberté, Egalité, Fraternité"
  ></bnum-img>
</header>

<main role="main">
  <div id="mel-login-form">
    <div class="login-title">
      <center>
        <h1>
          <roundcube:label name="mel.welcome" /><br />
          <roundcube:label name="mel.on_your_dwp" />
        </h1>
        <h3><roundcube:label name="mel.baseline" /></h3>
      </center>
    </div>
    <bnum-card
      data-title-text="<roundcube:label name="mel.login_card_title" />"
      data-title-icon="login"
    >
      <div class="login-columns">
        <section>
          <h3 id="login-title-h3" style="padding-bottom: 0px;margin-bottom: 10px;"><roundcube:label name="mel.login_with_credentials" /></h3>
          <div id="login-addons"></div>
          <roundcube:form name="form" method="post">
            <roundcube:object
              name="loginform"
              form="form"
              size="40"
              submit="true"
            />
            <roundcube:object name="message" id="message" />
          </roundcube:form>
        </section>
        <bnum-divider id="login-divider" class="bds-space-s-top"><roundcube:label name="mel.login_or" /></bnum-divider>
        <div class="login-or-vertical" aria-hidden="true"><span></span><roundcube:label name="mel.login_or" /><span></span></div>
        <section id="bnum-alt-connexion-container" class="bds-space-s-top">
          <h3 style="padding-bottom: 0px;margin-bottom: 10px;"><roundcube:label name="mel.login_with_cerbere" /></h3>
          <p><roundcube:label name="mel.login_with_cerbere_description" /></p>
          <center><!-- TODO : remplacer l'URL provisoire de « Qu'est-ce que Cerbère ? » -->
          <bnum-cerbere-button
            id="login-alt-1"
            data-info-url="https://authentification.din.developpement-durable.gouv.fr/authSAML/cgu.do"
          ></bnum-cerbere-button></center>
        </section>

      </div>
                <div class="footerbox bds-space-s-top">
            <bnum-alert-info>
              <roundcube:label name="mel.login_warning" />
              <br />
              <roundcube:object name="login_doc_message" id="doc_message" />
            </bnum-alert-info>
          </div>
    </bnum-card>
